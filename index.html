<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 50%, #ffd1dc 100%);
      font-family: 'Poppins', sans-serif;
      color: #4a2531;
      overflow: hidden;
      position: relative;
      padding: 1.5rem;
    }

    /* Floating Background Hearts */
    .bg-heart {
      position: fixed;
      bottom: -20px;
      font-size: 1.2rem;
      opacity: 0.45;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.5; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    /* Click Burst Hearts */
    .click-heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      z-index: 99;
      animation: popHeart 0.9s ease-out forwards;
    }

    @keyframes popHeart {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1.4); opacity: 0; }
    }

    /* Main Card */
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 45px rgba(214, 90, 120, 0.15);
      transition: all 0.4s ease;
    }

    .heart-icon {
      font-size: 3.2rem;
      display: inline-block;
      margin-bottom: 0.75rem;
      animation: heartbeat 1.8s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.12); }
      50% { transform: scale(1); }
      75% { transform: scale(1.08); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: #881337;
      margin-bottom: 0.75rem;
      line-height: 1.25;
    }

    p {
      font-size: 0.98rem;
      color: #6b3b49;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }

    /* Interactive Note Box */
    .note-box {
      background: #fff5f7;
      border: 1px dashed #fda4af;
      border-radius: 16px;
      padding: 1.1rem;
      margin-bottom: 1.75rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: #9f1239;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .note-box:hover {
      background: #ffe4e6;
      transform: scale(1.02);
    }

    .tap-hint {
      display: block;
      font-family: 'Poppins', sans-serif;
      font-style: normal;
      font-size: 0.75rem;
      color: #be123c;
      opacity: 0.75;
      margin-top: 0.4rem;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      min-height: 52px;
      position: relative;
    }

    button {
      font-family: 'Poppins', sans-serif;
      font-size: 0.98rem;
      font-weight: 500;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      z-index: 20;
    }

    .btn-yes {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.3);
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 24px rgba(225, 29, 72, 0.4);
    }

    .btn-yes:active {
      transform: scale(0.96);
    }

    .btn-no {
      background: #ffe4e6;
      color: #9f1239;
      border: 1px solid #fecdd3;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Initial Sweet Message -->
  <div class="card" id="step-1">
    <div class="heart-icon">💌</div>
    <h1>Hi, I made this for you.</h1>
    <p>
      Every time I talk to you, my day automatically gets a little brighter. 
      Tap the note below before you answer my question.
    </p>

    <div class="note-box" id="love-note">
      <span id="note-text">"You're honestly my favorite notification."</span>
      <span class="tap-hint">(Tap to read another reason)</span>
    </div>

    <p style="margin-bottom: 1.2rem; font-weight: 500; color: #881337;">
      Can I take you out sometime soon?
    </p>

    <div class="btn-row">
      <button type="button" class="btn-yes" id="yes-btn">Yes, I'd love to ❤️</button>
      <button type="button" class="btn-no" id="no-btn">No</
